spring:
  application:
    name: platform-admin-service

  datasource:
    url: jdbc:postgresql://localhost:5432/enterprise_platform
    username: postgres
    password: root1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

# Downstream Microservice Integrations & Resiliency Configurations
services:
  health-service:
    url: http://localhost:8081/actuator/health
    timeout-ms: 3000
  tenant-service:
    url: http://tenant-service
    fallback-url: http://localhost:8082
    timeout-ms: 3000
  user-service:
    url: http://user-service
    fallback-url: http://localhost:8083
    timeout-ms: 3000
  subscription-service:
    url: http://subscription-service
    fallback-url: http://localhost:8084
    timeout-ms: 3000

# Default Super Admin credentials for testing / basic authentication
app:
  security:
    admin-username: superadmin
    admin-password: "{noop}Admin@1234"