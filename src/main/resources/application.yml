server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: base-microservice

  datasource:
    url: jdbc:postgresql://localhost:5432/microservice_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: Root

    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      ddl-auto: update

    show-sql: false
    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        default_schema: public
        jdbc:
          lob:
            non_contextual_creation: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: google-client-id-placeholder
            client-secret: google-client-secret-placeholder
            scope:
              - email
              - profile
              - openid
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          github:
            client-id: github-client-id-placeholder
            client-secret: github-client-secret-placeholder
            scope:
              - user:email
              - read:user
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

# Application Configuration
app:
  tenant:
    default-tenant: default
    header-name: X-Tenant-ID

  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000

  oauth2:
    authorized-redirect-uris: http://localhost:3000/oauth2/redirect,http://localhost:8080/oauth2/redirect

# Springdoc OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html