spring.application.name=super-admin
spring:application:name: feature-management-service

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server:port: 8083


datasource:url: jdbc:postgresql://localhost:5432/enterprise_platform
username: postgres
password: postgres
driver-class-name: org.postgresql.Driver

jpa:hibernate:ddl-auto: validate
show-sql: false
properties:hibernate:format_sql: true

flyway:enabled: true
locations:- classpath:db/migration
baseline-on-migrate: true

management:endpoints:web:exposure:include:- health- info- metrics

endpoint:health:show-details: when_authorized

springdoc:api-docs:path: /v3/api-docs

swagger-ui:path: /swagger-ui.html

logging:level:root: INFO

com.enterprise.featuremanagement: DEBUG